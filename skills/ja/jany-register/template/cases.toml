# jany cases: __NAME__。`jany --test __NAME__` が回す。
# 期待値: argv / preview / risk / pipe / error / confidence / tokens / state / not_asked / setup.dirs / no_jev
# [case.jev] は jev の答えの Mock。聞かれないキーに答えると失敗する(--explain で何が聞かれるか見る)。

[[case]]
words = ["-v"]
argv  = [__ARGV0__, "-v"]
no_jev = true

