name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: JANY_CMD_DIR=examples cargo run --locked -- --test find
      - run: JANY_CMD_DIR=examples cargo run --locked -- --test curl
      - run: JANY_CMD_DIR=examples cargo run --locked -- --test docker run
      - run: cargo package --locked
