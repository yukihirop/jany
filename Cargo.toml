[package]
name = "jany"
version = "0.5.1"
edition = "2024"
description = "jev x any command: turn loosely ordered words into a command line, defined per command by a schema"
license = "MIT"
repository = "https://github.com/yukihirop/jany"
readme = "README.md"
keywords = ["cli", "command-line", "shell", "natural-language"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
toml = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rpassword = "7"
shell-words = "1"
regex = "1"
tempfile = "3"
